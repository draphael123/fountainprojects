<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fountain Vitality Projects</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <div class="page-header">
            <h1 class="page-title">🌊 Fountain Vitality Projects</h1>
        </div>
        
        <div class="database-wrapper">
            <div class="database-header">
                <button class="new-button" id="newBtn">
                    <span>+</span> New
                </button>
            </div>
            
            <div class="database-view">
                <table class="notion-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Owner</th>
                            <th>Due Date</th>
                            <th>URL</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-overlay"></div>
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">New Project</h3>
                <button class="modal-close" id="closeBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="projectForm">
                    <div class="field">
                        <label>Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="field">
                        <label>Status</label>
                        <select id="status">
                            <option>Not Started</option>
                            <option selected>In Progress</option>
                            <option>Completed</option>
                            <option>On Hold</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Owner</label>
                        <input type="text" id="owner">
                    </div>
                    <div class="field">
                        <label>Due Date</label>
                        <input type="date" id="dueDate">
                    </div>
                    <div class="field">
                        <label>URL</label>
                        <input type="url" id="url" placeholder="https://">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn-save">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
