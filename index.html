<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fountain Vitality - Project Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>🌊 Fountain Vitality</h1>
                <p class="tagline">Project Management Dashboard</p>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <span class="stat-number" id="totalProjects">0</span>
                    <span class="stat-label">Total Projects</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="activeProjects">0</span>
                    <span class="stat-label">In Progress</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="completedProjects">0</span>
                    <span class="stat-label">Completed</span>
                </div>
            </div>
        </header>

        <!-- Add Project Form -->
        <div class="add-project-section">
            <button class="btn-primary" id="toggleFormBtn">
                <span id="btnText">+ Add New Project</span>
            </button>
            
            <form id="projectForm" class="project-form hidden">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="projectName">Project Name *</label>
                        <input type="text" id="projectName" required placeholder="Enter project name">
                    </div>
                    
                    <div class="form-group">
                        <label for="projectStatus">Status *</label>
                        <select id="projectStatus" required>
                            <option value="Planning">Planning</option>
                            <option value="In Progress" selected>In Progress</option>
                            <option value="Review">Review</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="projectPriority">Priority</label>
                        <select id="projectPriority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="projectDueDate">Due Date</label>
                        <input type="date" id="projectDueDate">
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="projectDescription">Description</label>
                        <textarea id="projectDescription" rows="3" placeholder="Project details..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="projectOwner">Project Owner</label>
                        <input type="text" id="projectOwner" placeholder="Enter owner name">
                    </div>
                    
                    <div class="form-group">
                        <label for="projectProgress">Progress (%)</label>
                        <input type="number" id="projectProgress" min="0" max="100" value="0">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-success">Save Project</button>
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label for="filterStatus">Filter by Status:</label>
                <select id="filterStatus">
                    <option value="all">All Projects</option>
                    <option value="Planning">Planning</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Review">Review</option>
                    <option value="On Hold">On Hold</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="filterPriority">Filter by Priority:</label>
                <select id="filterPriority">
                    <option value="all">All Priorities</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                    <option value="Critical">Critical</option>
                </select>
            </div>
            
            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="🔍 Search projects...">
            </div>
        </div>

        <!-- Projects List -->
        <div class="projects-container">
            <h2>Projects In Process</h2>
            <div id="projectsList" class="projects-list">
                <!-- Projects will be dynamically inserted here -->
            </div>
            <div id="emptyState" class="empty-state">
                <p>📋 No projects yet. Click "Add New Project" to get started!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
